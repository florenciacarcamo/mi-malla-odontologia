<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malla Odontología UC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-malla">
        <h1>Malla Interactiva – Odontología – UC</h1>
        <div class="stats-container">
            <p>Avance: <span id="porcentaje">0.0</span>% | Ramos: <span id="contador">0</span>/62</p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <button onclick="reiniciarMalla()" class="btn-reiniciar">Borrar Progreso</button>
    </div>

    <div class="malla-container">
        <div class="semestre">
            <div class="sem-header">Semestre I</div>
            <div class="ramo disponible" id="ODO103" onclick="marcar('ODO103')"><span class="sigla">ODO103</span><p>Intro. Odontología</p></div>
            <div class="ramo disponible" id="MED1030" onclick="marcar('MED1030')"><span class="sigla">MED1030</span><p>Anatomía I</p></div>
            <div class="ramo disponible" id="QIM2010" onclick="marcar('QIM2010')"><span class="sigla">QIM2010</span><p>Química</p></div>
            <div class="ramo disponible" id="BIO2140" onclick="marcar('BIO2140')"><span class="sigla">BIO2140</span><p>Bio. Celular I</p></div>
            <div class="ramo disponible" id="ODO104" onclick="marcar('ODO104')"><span class="sigla">ODO104</span><p>Bioestadística</p></div>
        </div>

        <div class="semestre">
            <div class="sem-header">Electivos FG</div>
            <div class="ramo disponible" id="FG1" onclick="marcar('FG1')"><span class="sigla">FG</span><p>Formación General 1</p></div>
            <div class="ramo disponible" id="FG2" onclick="marcar('FG2')"><span class="sigla">FG</span><p>Formación General 2</p></div>
            <div class="ramo disponible" id="FG3" onclick="marcar('FG3')"><span class="sigla">FG</span><p>Formación General 3</p></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
